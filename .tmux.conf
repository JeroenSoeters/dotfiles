# ~/.tmux.conf — personal tmux config, layered on top of Omarchy.
#
# Load order matters: tmux sources /etc/tmux.conf, then ~/.tmux.conf, then
# ~/.config/tmux/tmux.conf — and the LAST file wins on conflicts. Omarchy ships a
# full ~/.config/tmux/tmux.conf, so to stay authoritative this file must occupy
# that slot (see install note in README): ~/.config/tmux/tmux.conf is symlinked
# here. We source Omarchy's pristine default first (keeping its M-Enter splits,
# vi copy-mode, Alt-number window nav, and OS-theme-following status bar), then
# override just the pieces we want different — mirroring how .bashrc layers on
# Omarchy. The default path below is refresh-safe: `omarchy-refresh-tmux` copies
# FROM it, so it's never clobbered.
source-file ~/.local/share/omarchy/config/tmux/tmux.conf

# ---------------------------------------------------------------------------
# Personal overrides (win because they run after the source above)
# ---------------------------------------------------------------------------

# --- Prefix: C-z (Omarchy uses C-Space + C-b as prefix2) ---
set -g prefix C-z
set -gu prefix2
unbind C-b
unbind C-Space
bind C-z last-window
bind z send-prefix

# --- Splits with | and - (in addition to Omarchy's h/v) ---
unbind %
bind | split-window -h
bind - split-window -v

# --- Behavior ---
set -g history-limit 30000
set -g set-titles-string '#T'

# Status bar at the bottom, with a toggle
set -g status-position bottom
bind-key b set-option status
