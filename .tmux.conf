# ~/.tmux.conf — personal tmux config
#
# Colors follow the OS (Omarchy) theme: the theme block below uses terminal
# palette color *names* (blue/black/brightblack/default) instead of fixed hex
# or 256-color codes. Those names resolve against whatever palette the current
# Omarchy theme applies to the terminal, so switching themes re-themes tmux
# automatically — no plugin or TPM required.

# --- Terminal / truecolor ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Allow escape sequence passthrough for graphics protocols (Kitty, Sixel, iTerm2)
set -g allow-passthrough on

# --- Prefix: C-z ---
set -g prefix C-z
unbind C-b
bind C-z last-window
bind z send-prefix

# --- Behavior ---
set -g mouse on
set -g history-limit 30000
set -sg escape-time 10

# Split panes with | and -
unbind %
bind | split-window -h
bind - split-window -v

# Start numbering at 1, keep it tidy
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Titles
set -g set-titles on
set -g set-titles-string '#T'
setw -g automatic-rename on

# Toggle the status bar
bind-key b set-option status

# --- Theme (follows the Omarchy OS theme via terminal palette names) ---
set -g status-style "bg=default,fg=default"
set -g window-status-separator ""
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
